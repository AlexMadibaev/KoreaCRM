services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koreacrm
      POSTGRES_PASSWORD: koreacrm
      POSTGRES_DB: koreacrm
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U koreacrm']
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-before-deployment}
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio_data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  minio_data:
